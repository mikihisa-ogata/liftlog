<!doctype html>
<html lang="ja" data-skin="iron">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>リフトログ</title>
<meta name="description" content="筋トレの種目・重量・回数を記録するアプリ">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d0d0d" id="meta-theme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="リフトログ">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<script>
  // 描画前にテーマを当てて、ちらつきを防ぐ
  try { const s = JSON.parse(localStorage.getItem("liftlog.skin")); if (["iron", "plate", "clock"].includes(s)) document.documentElement.dataset.skin = s; } catch {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=M+PLUS+1p:wght@500;700;800&family=Barlow+Condensed:ital,wght@1,700;1,800;1,900&family=Noto+Sans+JP:wght@500;700;900&family=Share+Tech+Mono&family=DotGothic16&display=swap">
<style>
/*
  テーマ（data-skin）
  iron  : 黒い鉄とセーフティイエロー。ハザードライン、極太コンデンス数字、角は立てる
  plate : 白地にプレートの赤・青・黄。上部は黒いヒーロー、斜体の太字数字、丸い角
  clock : ジムのインターバルタイマー。黒地に赤いLED数字、緑で自己ベスト
  どのテーマも決まった見た目なので、OSのライト/ダーク設定には追従しない。
*/
:root {
  --bg: #0d0d0d; --surface: #1a1a1a; --field: #0d0d0d; --ink: #f2f2f2; --muted: #b3b3b3; --line: #3a3a3a;
  --accent: #ffd400; --accent-ink: #000000; --accent-soft: #2b2600;
  --pr: #ffd400; --pr-ink: #000000; --danger: #ff5a4f;
  --top-band: #0d0d0d; --map-skin: #262626; --map-off: #3d3d3d;
  --font-num: "Anton", "Arial Narrow", "M PLUS 1p", sans-serif; --num-style: normal; --num-weight: 400;
  --font-head: "M PLUS 1p", "Hiragino Sans", sans-serif; --head-weight: 800;
  --font-body: "M PLUS 1p", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --radius: 0px; --radius-ctl: 0px; --glow: none;
  color-scheme: dark;
}
:root[data-skin="plate"] {
  --bg: #f4f4f2; --surface: #ffffff; --field: #f4f4f2; --ink: #111111; --muted: #555555; --line: #d4d4cf;
  --accent: #cf1f16; --accent-ink: #ffffff; --accent-soft: #fde4e2;
  --pr: #ffc20e; --pr-ink: #111111; --danger: #cf1f16;
  --top-band: #111111; --map-skin: #e4e4e0; --map-off: #c9c9c3;
  --font-num: "Barlow Condensed", "Arial Narrow", "Noto Sans JP", sans-serif; --num-style: italic; --num-weight: 900;
  --font-head: "Noto Sans JP", "Hiragino Sans", sans-serif; --head-weight: 900;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --radius: 18px; --radius-ctl: 999px; --glow: none;
  color-scheme: light;
}
:root[data-skin="clock"] {
  --bg: #0a0a0c; --surface: #141418; --field: #0a0a0c; --ink: #ededf0; --muted: #a8a8b4; --line: #34343c;
  --accent: #ff2e2e; --accent-ink: #ffffff; --accent-soft: #2a0f11;
  --pr: #39ff88; --pr-ink: #04140a; --danger: #ff2e2e;
  --top-band: #0a0a0c; --map-skin: #202026; --map-off: #383840;
  --font-num: "Share Tech Mono", ui-monospace, "SF Mono", monospace; --num-style: normal; --num-weight: 400;
  --font-head: "M PLUS 1p", "Hiragino Sans", sans-serif; --head-weight: 800;
  --font-body: "M PLUS 1p", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --radius: 10px; --radius-ctl: 10px; --glow: 0 0 10px rgba(255, 46, 46, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--top-band); }
.wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.num { font-family: var(--font-num); font-style: var(--num-style); font-weight: var(--num-weight); font-variant-numeric: tabular-nums; }

/* ---- 上部 ---- */
.hz { display: none; }
.hero { display: flex; flex-direction: column; gap: 14px; position: relative; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 0; }
.brand { font-family: "Anton", "Arial Narrow", sans-serif; font-weight: 400; font-size: 40px; letter-spacing: .02em; line-height: .9; margin: 0; }
.brand span { color: var(--accent); }
.hero.bare { gap: 0; }
/* アイアンは縞の下からすぐ始め、縞のないプレート・ジムクロックは上端に少し余白をとる */
[data-skin="plate"] .top, [data-skin="clock"] .top { padding-top: 12px; }
.hero.bare > :not(.hz) { display: none; }
.top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.skin-btn { border: 1px solid var(--line); background: transparent; color: var(--muted); font: 700 12px var(--font-body); padding: 4px 10px; border-radius: var(--radius-ctl); cursor: pointer; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; border-radius: var(--radius); container-type: inline-size; }
.stat .k { font-size: 12px; color: var(--muted); letter-spacing: .08em; font-weight: 700; }
.stat .v { font-family: var(--font-num); font-style: var(--num-style); font-weight: var(--num-weight); line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: min(32px, 26cqi); }
.stat .v small { font-family: var(--font-body); font-style: normal; font-size: 12px; color: var(--muted); font-weight: 700; margin-left: 3px; }

/* テーマ選択 */
.skin-dlg, .guide-dlg { border: 0; padding: 0; background: transparent; color: var(--ink); width: min(440px, calc(100% - 32px)); max-width: none; }
.skin-dlg::backdrop, .guide-dlg::backdrop { background: rgba(0, 0, 0, .6); }
.skins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: var(--surface); padding: 12px; border-radius: var(--radius); }
.skins-head { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; }
.skins-head .icon-btn:hover { color: var(--ink); }
.skin { border: 2px solid var(--line); border-radius: 10px; padding: 0; overflow: hidden; cursor: pointer; background: none; text-align: left; color: var(--ink); font: inherit; }
.skin[aria-pressed="true"] { border-color: var(--accent); }
.skin .sw { height: 54px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
.skin .nm { display: block; font-size: 12px; font-weight: 700; padding: 6px 8px; }
.sw-iron { background: #0d0d0d; color: #ffd400; font-family: "Anton", sans-serif; border-top: 6px solid; border-image: repeating-linear-gradient(-45deg, #ffd400 0 6px, #0d0d0d 6px 12px) 6; }
.sw-plate { background: #f4f4f2; color: #111; font-family: "Barlow Condensed", sans-serif; font-style: italic; font-weight: 900; box-shadow: inset 0 -8px 0 #e2231a; }
.sw-clock { background: #000; color: #ff2e2e; font-family: "Share Tech Mono", monospace; text-shadow: 0 0 8px rgba(255, 46, 46, .7); }

/* ---- タブ ---- */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 2px solid var(--ink); border-radius: var(--radius-ctl); overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink); font: 800 14px var(--font-body); padding: 10px 4px; cursor: pointer; border-radius: 0; }
.seg button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.tabs .seg button { display: flex; align-items: center; justify-content: center; gap: 5px; }
.tab-ic { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

h2 { font-size: 13px; letter-spacing: .12em; color: var(--muted); margin: 0; font-weight: 700; }
.view { display: flex; flex-direction: column; gap: 14px; }
#ex-list:empty { display: none; }

label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 700; }
input, textarea, select {
  font: 500 16px var(--font-body); color: var(--ink); background: var(--field);
  border: 1px solid var(--line); border-radius: min(var(--radius-ctl), 10px); padding: 9px 10px; width: 100%; min-width: 0;
}
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea { min-height: 72px; resize: vertical; }
.daterow { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
.daterow .field { flex: 0 1 200px; }
.editing { font-size: 12px; font-weight: 800; color: var(--accent-ink); background: var(--accent); padding: 4px 10px; border-radius: var(--radius-ctl); }

/* ---- 種目カード ---- */
.ex { background: var(--surface); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.ex-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ex-head h3, .day li b, .next-name { font-family: var(--font-head); font-weight: var(--head-weight); }
.ex-head h3 { margin: 0; font-size: 21px; line-height: 1.3; }
.prev { margin: 0; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.prev .num { font-size: 15px; color: var(--ink); }
.setgrid { display: grid; grid-template-columns: 34px 1fr 16px 1fr 32px; gap: 8px; align-items: center; }
.setgrid .h { font-size: 12px; color: var(--muted); letter-spacing: .08em; font-weight: 700; }
.setno { font-family: var(--font-num); font-style: var(--num-style); font-weight: var(--num-weight); font-size: 22px; color: var(--accent); text-shadow: var(--glow); }
.times { font-family: var(--font-body); font-size: 18px; color: var(--muted); text-align: center; }
.setgrid input { font-family: var(--font-num); font-style: var(--num-style); font-weight: var(--num-weight); font-size: 28px; line-height: 1.2; text-align: center; padding: 4px; font-variant-numeric: tabular-nums; border-radius: min(var(--radius-ctl), 12px); }

button { font-family: var(--font-body); }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 800; font-size: 14px; padding: 9px 14px; border-radius: var(--radius-ctl); cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-family: var(--font-head); font-weight: var(--head-weight); }
.btn.small { font-size: 12px; padding: 6px 12px; }
.btn.danger { color: var(--danger); }
.btn.armed, .btn.destroy { background: var(--danger); border-color: var(--danger); color: #ffffff; }
.btn.add-set { width: 100%; border-style: dashed; background: transparent; color: var(--muted); }
.icon-btn { border: 0; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; padding: 6px; cursor: pointer; border-radius: 6px; }
.icon-btn:hover { color: var(--danger); }
.del-ic { display: block; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.link { border: 0; background: none; color: var(--accent); font-weight: 800; font-size: 12px; padding: 0; cursor: pointer; }

.picker { border: 1px dashed var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--radius-ctl); padding: 6px 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.add::before { content: "＋ "; color: var(--accent); }
.custom { display: flex; gap: 8px; }
.custom .btn { white-space: nowrap; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .primary { flex: 1 1 200px; padding: 15px; font-size: 18px; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }

/* ---- 履歴 ---- */
.month { font-family: var(--font-num); font-style: var(--num-style); font-weight: var(--num-weight); font-size: 22px; letter-spacing: .04em; margin: 8px 0 -4px; }
.day { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.day-date { font-weight: 800; font-size: 16px; display: flex; gap: 8px; align-items: center; }
.day-meta { font-size: 12px; color: var(--muted); }
.day ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.day li { display: grid; grid-template-columns: minmax(0, 9em) 1fr; gap: 10px; align-items: baseline; }
.day li b { font-size: 14px; }
.day li .num, .day > .num { font-size: 17px; overflow-wrap: anywhere; }
.memo { margin: 0; font-size: 13px; color: var(--muted); white-space: pre-wrap; border-left: 2px solid var(--line); padding-left: 10px; }
.day-foot { display: flex; gap: 8px; justify-content: flex-end; }
.badge { font-size: 11px; font-weight: 800; padding: 2px 8px; white-space: nowrap; border-radius: min(var(--radius-ctl), 4px); font-family: var(--font-body); font-style: normal; }
.badge.pr { background: var(--pr); color: var(--pr-ink); }
.badge.sample { background: var(--accent-soft); color: var(--accent); }
.notice { background: var(--accent-soft); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

.mapcard { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.mapcard-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.mapcard-body { display: flex; flex-direction: column; gap: 14px; align-items: center; }
.mapcard-body .body-map { max-width: 280px; }
.mrank { list-style: none; margin: 0; padding: 0; align-self: stretch; columns: 2 140px; column-gap: 24px; font-size: 13px; font-weight: 700; }
.mrank li { display: flex; align-items: center; gap: 8px; padding-block: 2px; break-inside: avoid; }
.mrank .num { margin-left: auto; font-size: 17px; }
.sw-lv { width: 12px; height: 12px; flex: none; background: var(--c); border-radius: 3px; }
.mlegend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.mlegend span { display: inline-flex; align-items: center; gap: 4px; }
.day-body { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 12px; align-items: start; }

/* ---- 推移 ---- */
.prog-ctrl { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.prog-ctrl .field { flex: 1 1 220px; }
.seg.small { grid-template-columns: repeat(3, auto); display: inline-grid; border-width: 1px; }
.seg.small button { padding: 7px 12px; font-size: 13px; }
.chart { background: var(--surface); border-radius: var(--radius); padding: 10px 6px 4px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .lbl { fill: var(--muted); font: 13px var(--font-num); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent); opacity: .12; }
.chart .pt { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart .pt.best { fill: var(--pr); stroke: var(--pr); }
.chart .end { fill: var(--ink); font: 16px var(--font-num); }
.pbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pb { background: var(--surface); border-radius: var(--radius); padding: 10px 12px; min-width: 0; }
.pb .k { font-size: 12px; color: var(--muted); font-weight: 700; }
.pb .v { font-family: var(--font-num); font-style: var(--num-style); font-weight: var(--num-weight); font-size: 28px; line-height: 1.2; }
.pb .v small { font-family: var(--font-body); font-style: normal; font-size: 12px; color: var(--muted); }
.pb .d { font-size: 12px; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); margin: 0; }

/* ---- 種目ガイド ---- */
.g-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.gcard { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--radius); padding: 8px 8px 10px; display: flex; flex-direction: column; gap: 4px; text-align: left; cursor: pointer; font: inherit; }
.gcard b { font-family: var(--font-head); font-weight: var(--head-weight); font-size: 15px; line-height: 1.3; }
.gcard small { font-size: 12px; color: var(--muted); line-height: 1.4; }
.gfig svg, .poses svg { display: block; width: 100%; height: auto; background: var(--field); border-radius: min(var(--radius), 8px); }
.guide-dlg { width: min(560px, calc(100% - 32px)); }
/* 確認ダイアログ */
.confirm-dlg { border: 0; padding: 0; background: transparent; color: var(--ink); width: min(340px, calc(100% - 32px)); max-width: none; }
.confirm-dlg::backdrop { background: rgba(0, 0, 0, .6); }
.confirm-body { margin: 0; background: var(--surface); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.confirm-body h3 { margin: 0; font-size: 17px; }
.confirm-body p { margin: 0; font-size: 13px; color: var(--muted); }
.confirm-actions { display: flex; gap: 8px; margin-top: 12px; }
.confirm-actions .btn { flex: 1; padding: 12px; }
.guide-body { background: var(--surface); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.guide-body h3 { margin: 0; font-family: var(--font-head); font-weight: var(--head-weight); font-size: 21px; line-height: 1.3; }
.guide-body h2 { margin-top: 6px; }
.poses { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.poses figure { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.poses figcaption { font-size: 12px; font-weight: 800; }
.fig-body, .fig-ghost { fill: none; stroke: var(--ink); stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; }
.fig-body circle, .fig-ghost circle { fill: var(--ink); stroke: none; }
.fig-ghost { opacity: .2; }
.fig-gear { fill: none; stroke: var(--muted); stroke-linecap: round; }
.fig-gear .solid { fill: var(--muted); stroke: none; }
.fig-arrow { stroke: var(--accent); stroke-width: 3; fill: var(--accent); stroke-linecap: round; }
.fig-floor { stroke: var(--line); stroke-width: 2; }
.muscles { display: flex; gap: 14px; align-items: center; }
.body-map { display: block; width: 100%; height: auto; }
.bm-sil { fill: var(--map-skin); }
.body-map .m { fill: var(--c); stroke: var(--surface); stroke-width: .8; stroke-linejoin: round; }
.body-map text { fill: var(--muted); font-size: 12px; font-weight: 700; text-anchor: middle; }
.body-map.mini text { display: none; }
.lv0 { --c: var(--map-off); }
.lv1 { --c: color-mix(in srgb, var(--accent) 30%, var(--map-off)); }
.lv2 { --c: color-mix(in srgb, var(--accent) 55%, var(--map-off)); }
.lv3 { --c: color-mix(in srgb, var(--accent) 80%, var(--map-off)); }
.lv4 { --c: var(--accent); }
.muscles .body-map { width: 150px; flex: none; }
.mlist { display: flex; flex-wrap: wrap; gap: 6px; align-content: center; min-width: 0; }
.mchip { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: var(--radius-ctl); }
.mchip.main { background: var(--accent); color: var(--accent-ink); }
.mchip.sub { background: var(--accent-soft); color: var(--ink); }
.steps, .tips { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.guide-body .btn.primary { padding: 13px; font-size: 16px; margin-top: 6px; }
.ex-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
.backup { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; margin-top: 8px; }
.backup .actions { gap: 8px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: var(--radius-ctl); font-size: 14px; font-weight: 800; z-index: 20; transition: opacity .2s; max-width: calc(100% - 32px); }
.toast.hide { opacity: 0; pointer-events: none; }

/* ==== IRON 固有 ==== */
[data-skin="iron"] .hz { display: block; height: 10px; margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); background: repeating-linear-gradient(-45deg, var(--accent) 0 12px, var(--bg) 12px 24px); }
[data-skin="iron"] .stat { border-left: 4px solid var(--accent); }
[data-skin="iron"] .ex, [data-skin="iron"] .day, [data-skin="iron"] .pb, [data-skin="iron"] .chart { border: 1px solid var(--line); }

/* ==== PLATE 固有 ==== */
[data-skin="plate"] .hero {
  background: #111111; color: #ffffff; overflow: hidden; border-radius: 0 0 24px 24px; padding: 0 20px 20px;
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
}
[data-skin="plate"] .hero::before, [data-skin="plate"] .hero::after { content: ""; position: absolute; border-radius: 50%; pointer-events: none; }
[data-skin="plate"] .hero::after { right: -130px; top: -40px; width: 230px; height: 230px; border: 26px solid #e2231a; }
[data-skin="plate"] .hero::before { right: -60px; top: 20px; width: 110px; height: 110px; border: 16px solid #0057b8; z-index: 0; }
[data-skin="plate"] .hero.bare { background: none; padding: 0; }
[data-skin="plate"] .hero.bare::before, [data-skin="plate"] .hero.bare::after { display: none; }
[data-skin="plate"] .hero > * { position: relative; z-index: 1; }
[data-skin="plate"] .brand { font-family: "Barlow Condensed", sans-serif; font-style: italic; font-weight: 900; font-size: 30px; }
[data-skin="plate"] .brand span { color: #ffffff; }
[data-skin="plate"] .stat .k, [data-skin="plate"] .stat .v small { color: #b5b5b5; }
[data-skin="plate"] .skin-btn { border-color: #555; color: #ddd; }
[data-skin="plate"] .stats { padding-right: 64px; }
[data-skin="plate"] .stat { background: transparent; padding: 0; }
[data-skin="plate"] .stat .v { font-size: min(44px, 24cqi); color: #ffffff; }
[data-skin="plate"] .stat:first-child .v { color: #ffc20e; }
[data-skin="plate"] .skins { color: var(--ink); }
[data-skin="plate"] .seg { border: 0; background: var(--surface); padding: 4px; gap: 4px; box-shadow: 0 1px 0 var(--line); }
[data-skin="plate"] .seg button { border-radius: 999px; }
[data-skin="plate"] .ex, [data-skin="plate"] .day, [data-skin="plate"] .pb, [data-skin="plate"] .chart { box-shadow: 0 2px 0 rgba(0, 0, 0, .05); }
[data-skin="plate"] .setgrid input { border: 0; }
[data-skin="plate"] .ex-head h3::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: .1em; }
[data-skin="plate"] .setno { color: var(--muted); }
[data-skin="plate"] .btn.primary { box-shadow: 0 6px 16px rgba(226, 35, 26, .35); }

/* ==== GYM CLOCK 固有 ==== */
[data-skin="clock"] .brand { font-family: "DotGothic16", monospace; font-size: 30px; letter-spacing: .08em; }
[data-skin="clock"] .brand span { text-shadow: var(--glow); }
[data-skin="clock"] h2, [data-skin="clock"] .setgrid .h { font-family: "Share Tech Mono", monospace; letter-spacing: .2em; }
[data-skin="clock"] .stats { background: #000000; border: 3px solid #26262c; border-radius: 14px; padding: 14px 10px; gap: 0; box-shadow: 0 10px 30px rgba(0, 0, 0, .6); }
[data-skin="clock"] .stat { background: transparent; align-items: center; padding: 0 4px; border-radius: 0; }
[data-skin="clock"] .stat + .stat { border-left: 1px solid #1d1d22; }
[data-skin="clock"] .stat .k { font-family: "DotGothic16", monospace; font-weight: 400; letter-spacing: .04em; }
[data-skin="clock"] .stat .v { color: var(--accent); text-shadow: var(--glow); font-size: min(34px, 22cqi); }
[data-skin="clock"] .stat:last-child .v { color: var(--pr); text-shadow: 0 0 10px rgba(57, 255, 136, .5); }
[data-skin="clock"] .seg { border: 1px solid var(--line); background: var(--surface); }
[data-skin="clock"] .seg button[aria-selected="true"] { background: transparent; color: var(--accent); text-shadow: var(--glow); box-shadow: inset 0 -3px 0 var(--accent); }
[data-skin="clock"] .ex, [data-skin="clock"] .day, [data-skin="clock"] .pb, [data-skin="clock"] .chart, [data-skin="clock"] .skins { border: 1px solid var(--line); }
[data-skin="clock"] .badge.pr { background: transparent; color: var(--pr); border: 1px solid var(--pr); text-shadow: 0 0 6px rgba(57, 255, 136, .5); }
[data-skin="clock"] .btn.primary { box-shadow: 0 0 18px rgba(255, 46, 46, .35); }
[data-skin="clock"] .chart .line { filter: drop-shadow(0 0 4px rgba(255, 46, 46, .6)); }

@media (max-width: 460px) {
  .stat .v { font-size: min(26px, 26cqi); }
  [data-skin="plate"] .stat .v { font-size: min(36px, 24cqi); }
  .stat { padding: 10px; }
  .pbs { grid-template-columns: 1fr 1fr; }
  .day li { grid-template-columns: 1fr; gap: 0; }
  .setgrid input { font-size: 24px; }
}
/* スマホ幅ではタブを画面下に固定する（親指で届くように）。入力中はキーボードの邪魔になるので隠す */
@media (max-width: 640px) {
  body { padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
  .tabs {
    position: fixed; top: auto; left: 0; right: 0; bottom: 0; border-top: 1px solid var(--line);
    padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  /* 枠なしで端まで敷き、アイコンの下に小さく文言を置く（テーマ側の枠・角丸もここで打ち消す） */
  .tabs .seg { border: 0; border-radius: 0; padding: 0; gap: 0; background: transparent; box-shadow: none; }
  .tabs .seg button { flex-direction: column; gap: 3px; padding: 8px 4px; font-size: 11px; line-height: 1.2; border-radius: 0; }
  .tabs .tab-ic { width: 24px; height: 24px; }
  .typing .tabs { display: none; }
  .toast { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  .typing .toast { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="hz"></div>
    <header class="top">
      <h1 class="brand">LIFT<span>LOG</span></h1>
      <div class="top-right">
        <button class="skin-btn" id="btn-skin" aria-haspopup="dialog" aria-controls="skins">テーマ</button>
      </div>
    </header>
    <section class="stats" aria-label="今週のまとめ">
      <div class="stat"><span class="k">連続</span><span class="v" id="s-streak">0<small>週</small></span></div>
      <div class="stat"><span class="k">今週</span><span class="v" id="s-week">0<small>回</small></span></div>
      <div class="stat"><span class="k">累計</span><span class="v" id="s-total">0<small>日</small></span></div>
    </section>
  </div>

  <dialog class="skin-dlg" id="skins" aria-labelledby="skins-title">
    <div class="skins">
      <div class="skins-head"><h2 id="skins-title">テーマ</h2><button class="icon-btn" data-close aria-label="閉じる">×</button></div>
      <button class="skin" data-skin="iron"><span class="sw sw-iron">IRON</span><span class="nm">アイアン</span></button>
      <button class="skin" data-skin="plate"><span class="sw sw-plate">PLATE</span><span class="nm">プレート</span></button>
      <button class="skin" data-skin="clock"><span class="sw sw-clock">01:24</span><span class="nm">ジムクロック</span></button>
    </div>
  </dialog>

  <nav class="tabs">
    <div class="seg" role="tablist">
      <button role="tab" id="tab-log" data-tab="log"><svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>記録</button>
      <button role="tab" id="tab-history" data-tab="history"><svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>履歴</button>
      <button role="tab" id="tab-progress" data-tab="progress"><svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>推移</button>
      <button role="tab" id="tab-guide" data-tab="guide"><svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10 5 7 4.5 3.5 5v13.5c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"/><path d="M12 6.5V20"/></svg>ガイド</button>
    </div>
  </nav>

  <!-- 記録 -->
  <section class="view" id="view-log">
    <div class="daterow">
      <label class="field">日付<input type="date" id="f-date"></label>
      <span id="edit-flag" class="editing" hidden>過去の記録を編集中</span>
    </div>
    <div id="ex-list" class="view"></div>
    <div class="picker">
      <h2>種目を追加</h2>
      <div class="chips" id="parts"></div>
      <div class="chips" id="presets"></div>
      <form class="custom" id="custom-form">
        <input id="f-custom" placeholder="その他の種目名" aria-label="その他の種目名">
        <button class="btn" type="submit">追加</button>
      </form>
    </div>
    <label class="field">メモ<textarea id="f-memo" placeholder="調子、睡眠、フォームの気づきなど"></textarea></label>
    <div class="actions">
      <button class="btn primary" id="btn-save">保存</button>
      <button class="btn" id="btn-clear">入力をクリア</button>
    </div>
  </section>

  <!-- 履歴 -->
  <section class="view" id="view-history-wrap" hidden>
    <div id="view-history" class="view"></div>
    <div class="backup">
      <h2>バックアップ</h2>
      <p class="note">記録はこの端末の中だけに保存されます。機種変更の前や、ときどきの控えとしてファイルに書き出しておいてください。読み込むと、同じ記録は上書きされ、それ以外は追加されます。</p>
      <div class="actions">
        <button class="btn small" id="btn-export">ファイルに書き出す</button>
        <button class="btn small" id="btn-import">ファイルから読み込む</button>
        <input type="file" id="f-import" accept="application/json,.json" hidden>
      </div>
    </div>
  </section>

  <!-- 推移 -->
  <section class="view" id="view-progress" hidden>
    <div class="prog-ctrl">
      <label class="field">種目<select id="f-ex"></select></label>
      <div class="seg small" id="metric">
        <button data-m="e1rm">推定1RM</button>
        <button data-m="max">最大重量</button>
        <button data-m="vol">ボリューム</button>
      </div>
    </div>
    <div id="prog-body" class="view"></div>
  </section>

  <!-- 種目ガイド -->
  <section class="view" id="view-guide" hidden>
    <div class="chips" id="g-parts"></div>
    <div class="g-list" id="g-list"></div>
  </section>
</div>
<dialog class="guide-dlg" id="guide" aria-labelledby="guide-title"><div class="guide-body"></div></dialog>
<dialog class="confirm-dlg" id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-note">
  <form method="dialog" class="confirm-body">
    <h3 id="confirm-title"></h3>
    <p id="confirm-note"></p>
    <div class="confirm-actions"><button class="btn" value="cancel">キャンセル</button><button class="btn destroy" value="ok" id="confirm-ok"></button></div>
  </form>
</dialog>
<div id="toast" class="toast hide" role="status"></div>

<script>
const PRESETS = {
  "胸": ["ベンチプレス", "インクラインベンチプレス", "ダンベルプレス", "ダンベルフライ", "ディップス", "腕立て伏せ"],
  "肩": ["ショルダープレス", "サイドレイズ", "リアレイズ", "フェイスプル"],
  "背中": ["デッドリフト", "懸垂", "ラットプルダウン", "ベントオーバーロウ", "シーテッドロウ"],
  "腕": ["バーベルカール", "ハンマーカール", "プレスダウン", "フレンチプレス"],
  "腹": ["クランチ", "アブローラー", "ハンギングレッグレイズ"],
  "脚": ["スクワット", "レッグプレス", "ルーマニアンデッドリフト", "レッグカール", "レッグエクステンション", "カーフレイズ"]
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const today = () => ymd(new Date());
const parseD = s => new Date(s + "T00:00:00");
const fmtDate = s => { const d = parseD(s); return `${d.getMonth() + 1}/${d.getDate()}（${"日月火水木金土"[d.getDay()]}）`; };
const fmtShort = s => { const d = parseD(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
const fmtN = n => Math.round(n).toLocaleString("ja-JP");
const fmtW = n => String(Math.round(n * 10) / 10);
const e1rm = (w, r) => r <= 0 || w <= 0 ? 0 : (r === 1 ? w : w * (1 + r / 30));
const exVol = e => e.sets.reduce((a, s) => a + (+s.w || 0) * (+s.r || 0), 0);
const wVol = w => w.exercises.reduce((a, e) => a + exVol(e), 0);
const setsText = sets => sets.map(s => (+s.w ? fmtW(+s.w) + "×" : "自重×") + (+s.r || 0)).join(" · ");
const newId = () => "w-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

let workouts = [];
const ui = { tab: ls.get("liftlog.tab", "log"), part: "胸", gpart: "胸", ex: null, metric: ls.get("liftlog.metric", "e1rm"), hp: [7, 28, 91].includes(ls.get("liftlog.hp")) ? ls.get("liftlog.hp") : 7 };
const blankDraft = () => ({ id: null, date: today(), exercises: [], memo: "" });
let draft = ls.get("liftlog.draft", null) || blankDraft();
const saveDraft = () => ls.set("liftlog.draft", draft);

/* ---------- 保存先：この端末（localStorage） ---------- */
const localAll = () => ls.get("liftlog.workouts", {});
function setWorkouts(list) {
  workouts = list.sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
  renderData();
}
function loadLocal() { setWorkouts(Object.entries(localAll()).map(([id, v]) => ({ ...v, id }))); }
function writeAll(all) {
  try { localStorage.setItem("liftlog.workouts", JSON.stringify(all)); }
  catch { throw { code: "storage" }; }
}
async function putWorkout(id, data) { const all = localAll(); all[id] = data; writeAll(all); loadLocal(); }
async function removeWorkout(id) { const all = localAll(); delete all[id]; writeAll(all); loadLocal(); }

// 初回起動時だけ見本の記録を入れる（履歴の「サンプルを削除」で消せる）
function seedSamples() {
  if (ls.get("liftlog.seeded", false)) return;
  ls.set("liftlog.seeded", true);
  if (Object.keys(localAll()).length) return;
  const day = n => { const d = new Date(); d.setDate(d.getDate() - n); return ymd(d); };
  const S = (name, ...sets) => ({ name, sets: sets.map(([w, r]) => ({ w, r })) });
  const list = [
    [12, [S("ベンチプレス", [60, 10], [60, 8], [55, 10]), S("ダンベルフライ", [12, 12], [12, 10]), S("ディップス", [0, 12], [0, 10])], ""],
    [10, [S("スクワット", [80, 8], [80, 8], [80, 6]), S("レッグカール", [35, 12], [35, 12])], "腰に違和感なし"],
    [8, [S("懸垂", [0, 8], [0, 7], [0, 6]), S("ベントオーバーロウ", [50, 10], [50, 10])], ""],
    [5, [S("ベンチプレス", [62.5, 8], [62.5, 8], [60, 8]), S("ダンベルフライ", [12, 12], [12, 12])], ""],
    [3, [S("スクワット", [85, 6], [85, 6], [80, 8]), S("カーフレイズ", [40, 15], [40, 15])], ""],
    [1, [S("ベンチプレス", [65, 6], [62.5, 8], [60, 9]), S("サイドレイズ", [8, 15], [8, 12])], "3セット目はギリギリ"]
  ];
  const all = {};
  list.forEach(([n, exercises, memo], i) => { all["sample-" + i] = { example: true, date: day(n), exercises, memo, createdAt: i }; });
  ls.set("liftlog.workouts", all);
}

/* ---------- 共通 ---------- */
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.remove("hide");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add("hide"), 2200);
}
// 確認ダイアログを出し、実行するボタンが押されたら true を返す。外側・Esc・キャンセルは false
function askConfirm(title, note, ok) {
  const d = $("#confirm");
  $("#confirm-title").textContent = title; $("#confirm-note").textContent = note; $("#confirm-ok").textContent = ok;
  d.returnValue = ""; d.showModal();
  return new Promise(res => d.addEventListener("close", () => res(d.returnValue === "ok"), { once: true }));
}
$("#confirm").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
// 確認ダイアログの代わりに「2回押し」で実行する
function twoTap(btn, label, fn) {
  if (btn.dataset.armed) { delete btn.dataset.armed; btn.classList.remove("armed"); fn(); return; }
  const orig = btn.textContent;
  btn.dataset.armed = "1"; btn.classList.add("armed"); btn.textContent = label;
  setTimeout(() => { if (btn.dataset.armed) { delete btn.dataset.armed; btn.classList.remove("armed"); btn.textContent = orig; } }, 3000);
}
function setTab(t) {
  ui.tab = t; ls.set("liftlog.tab", t);
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  $(".hero").classList.toggle("bare", t !== "log"); // ロゴ・テーマ・まとめは記録タブだけ。ほかのタブでは画面を広く使う
  $("#view-log").hidden = t !== "log";
  $("#view-history-wrap").hidden = t !== "history";
  $("#view-progress").hidden = t !== "progress";
  $("#view-guide").hidden = t !== "guide";
  window.scrollTo({ top: 0 });
}
// その種目を最後にやった日（編集中の記録は除く）
function lastSession(name) {
  for (const w of workouts) {
    if (w.id === draft.id || w.date > draft.date) continue;
    const e = w.exercises.find(x => x.name === name);
    if (e) return { date: w.date, sets: e.sets };
  }
  return null;
}

/* ---------- まとめ ---------- */
function renderStats() {
  const now = new Date(); const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));
  const wk = workouts.filter(w => w.date >= ymd(mon));
  $("#s-week").innerHTML = `${wk.length}<small>回</small>`;
  // 1回以上やった週（月曜始まり）が何週続いているか。今週がまだなら先週までで数える
  const weeks = new Set(workouts.map(w => { const d = parseD(w.date); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); }));
  const wkStart = new Date(mon);
  if (!weeks.has(ymd(wkStart))) wkStart.setDate(wkStart.getDate() - 7);
  let streak = 0;
  while (weeks.has(ymd(wkStart))) { streak++; wkStart.setDate(wkStart.getDate() - 7); }
  $("#s-streak").innerHTML = `${streak}<small>週</small>`;
  $("#s-total").innerHTML = `${new Set(workouts.map(w => w.date)).size}<small>日</small>`;
}

/* ---------- 記録 ---------- */
function renderPicker() {
  $("#parts").innerHTML = Object.keys(PRESETS).map(p => `<button class="chip" data-part="${p}" aria-pressed="${p === ui.part}">${p}</button>`).join("");
  $("#presets").innerHTML = PRESETS[ui.part].map(n => `<button class="chip add" data-add="${esc(n)}">${esc(n)}</button>`).join("");
}
function renderLog() {
  $("#f-date").value = draft.date;
  $("#f-memo").value = draft.memo;
  $("#edit-flag").hidden = !draft.id;
  $("#btn-save").textContent = draft.id ? "変更を保存" : "保存";
  const list = $("#ex-list");
  if (!draft.exercises.length) {
    list.innerHTML = "";
    return;
  }
  list.innerHTML = draft.exercises.map((e, i) => {
    const prev = lastSession(e.name);
    const prevHtml = prev
      ? `<p class="prev">前回 ${fmtShort(prev.date)}<span class="num">${esc(setsText(prev.sets))}</span><button class="link" data-act="copy-prev">前回をコピー</button></p>`
      : `<p class="prev">この種目は初めての記録です</p>`;
    const rows = e.sets.map((s, j) => `
      <span class="setno">${String(j + 1).padStart(2, "0")}</span>
      <input inputmode="decimal" type="number" step="0.5" min="0" id="w-${i}-${j}" data-s="${j}" data-k="w" value="${esc(s.w)}" placeholder="0" aria-label="${j + 1}セット目の重量">
      <span class="times">×</span>

/* ---------- 履歴 ---------- */
// 各記録で、その日までの自己ベスト（推定1RM）を更新した種目
function prMap() {
  const best = {}, out = {};
  [...workouts].reverse().forEach(w => {
    out[w.id] = new Set();
    for (const e of w.exercises) {
      const m = Math.max(0, ...e.sets.map(s => e1rm(s.w, s.r)));
      if (m > 0 && best[e.name] !== undefined && m > best[e.name]) out[w.id].add(e.name);
      if (m > (best[e.name] ?? 0) || best[e.name] === undefined) best[e.name] = Math.max(m, best[e.name] ?? 0);
    }
  });
  return out;
}
// 部位ごとのセット数。主に効く部位は1セット、補助で使う部位は0.5セットと数える
function muscleSets(ws) {
  const sets = {}, unknown = new Set();
  for (const w of ws) for (const e of w.exercises) {
    const g = GUIDE[e.name];
    if (!g) { unknown.add(e.name); continue; }
    g.main.forEach(m => sets[m] = (sets[m] || 0) + e.sets.length);
    g.sub.forEach(m => sets[m] = (sets[m] || 0) + e.sets.length / 2);
  }
  return { sets, unknown };
}
// 色の濃さ（0〜4）。steps は 2〜4 段目になるセット数
const lvOf = (n, steps) => n > 0 ? 1 + steps.filter(t => n >= t).length : 0;
const WEEK_STEPS = [4, 8, 12], DAY_STEPS = [3, 5, 8];
const PERIODS = [[7, "1週間"], [28, "4週間"], [91, "3か月"]];
function mapCard() {
  const days = ui.hp, from = new Date(); from.setDate(from.getDate() - days + 1);
  const { sets, unknown } = muscleSets(workouts.filter(w => w.date >= ymd(from)));
  const perWeek = m => (sets[m] || 0) * 7 / days;
  const lv = m => lvOf(perWeek(m), WEEK_STEPS);
  const rank = Object.keys(sets).sort((a, b) => sets[b] - sets[a]);
  return `<section class="mapcard">
    <div class="mapcard-head"><h2>鍛えた部位</h2><div class="chips">${PERIODS.map(([d, l]) => `<button class="chip" data-hp="${d}" aria-pressed="${d === days}">${l}</button>`).join("")}</div></div>
    <div class="mapcard-body">${bodyMap(lv)}
      ${rank.length ? `<ol class="mrank">${rank.map(m => `<li class="lv${lv(m)}" title="${MUSCLE[m]}"><i class="sw-lv"></i>${MUSCLE_SHORT[m]}<span class="num">${Math.round(perWeek(m) * 10) / 10}</span></li>`).join("")}</ol>`
        : `<p class="empty">この期間の記録はありません。</p>`}
    </div>
    <div class="mlegend">数字と色の濃さは1週間あたりのセット数：${["1〜", "4〜", "8〜", "12〜"].map((t, i) => `<span class="lv${i + 1}"><i class="sw-lv"></i>${t}</span>`).join("")}</div>
    <p class="note">補助で使う部位は0.5セットとして数えています。${unknown.size ? `部位が登録されていない種目（${[...unknown].map(esc).join("・")}）は含みません。` : ""}</p>
  </section>`;
}
function renderHistory() {
  const v = $("#view-history");
  if (!workouts.length) {
    v.innerHTML = `<p class="empty">まだ記録がありません。「記録」タブで種目とセットを入れて保存すると、ここに日付ごとに並びます。</p>`;

/* ---------- 推移 ---------- */
function niceStep(raw) { const p = 10 ** Math.floor(Math.log10(raw)); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function chartSvg(pts, unit) {
  const W = 640, H = 250, L = 46, R = 56, T = 18, B = 30;
  const vs = pts.map(p => p.v); let lo = Math.min(...vs), hi = Math.max(...vs);
  if (lo === hi) { lo = lo * 0.9; hi = hi * 1.1 || 1; }
  const pad = (hi - lo) * 0.12; lo = Math.max(0, lo - pad); hi = hi + pad;
  const step = niceStep((hi - lo) / 4);
  const ts = pts.map(p => parseD(p.date).getTime()), t0 = Math.min(...ts), t1 = Math.max(...ts);
  const x = t => t1 === t0 ? L + (W - L - R) / 2 : L + (t - t0) / (t1 - t0) * (W - L - R);
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  let g = "";
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="lbl" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmtN(v)}</text>`;
  }
  const xy = pts.map((p, i) => [x(ts[i]), y(p.v)]);
  const line = xy.map((c, i) => (i ? "L" : "M") + c[0].toFixed(1) + " " + c[1].toFixed(1)).join(" ");
  const area = pts.length > 1 ? `<path class="area" d="${line} L${xy[xy.length - 1][0]} ${H - B} L${xy[0][0]} ${H - B} Z"/>` : "";
  const bestI = vs.indexOf(Math.max(...vs));
  const idx = [...new Set([0, Math.floor((pts.length - 1) / 2), pts.length - 1])];
  const xl = idx.map(i => `<text class="lbl" x="${xy[i][0]}" y="${H - 8}" text-anchor="middle">${fmtShort(pts[i].date)}</text>`).join("");
  const dots = xy.map((c, i) => `<circle class="pt${i === bestI ? " best" : ""}" cx="${c[0]}" cy="${c[1]}" r="${i === xy.length - 1 || i === bestI ? 5 : 3.5}"><title>${fmtDate(pts[i].date)} ${fmtW(pts[i].v)}${unit}</title></circle>`).join("");
  const last = xy[xy.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="推移グラフ">${g}${area}${pts.length > 1 ? `<path class="line" d="${line}"/>` : ""}${dots}<text class="end" x="${last[0] + 9}" y="${last[1] + 5}">${fmtN(pts[pts.length - 1].v)}</text>${xl}</svg>`;
}
function renderProgress() {
  const counts = {};
  workouts.forEach(w => w.exercises.forEach(e => counts[e.name] = (counts[e.name] || 0) + 1));
  const names = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  const sel = $("#f-ex"), body = $("#prog-body");
  document.querySelectorAll("#metric button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.m === ui.metric)));
  if (!names.length) {
    sel.innerHTML = `<option>記録なし</option>`; sel.disabled = true;
    body.innerHTML = `<p class="empty">記録が2回以上たまると、種目ごとに重量の伸びがグラフで見られます。</p>`;
    return;
  }
  sel.disabled = false;
  if (!names.includes(ui.ex)) ui.ex = names[0];
  sel.innerHTML = names.map(n => `<option value="${esc(n)}"${n === ui.ex ? " selected" : ""}>${esc(n)}（${counts[n]}回）</option>`).join("");

  const sessions = [...workouts].reverse().map(w => ({ date: w.date, e: w.exercises.find(x => x.name === ui.ex) })).filter(s => s.e);
  const metricOf = { e1rm: e => Math.max(...e.sets.map(s => e1rm(s.w, s.r))), max: e => Math.max(...e.sets.map(s => s.w)), vol: exVol };
  const unit = "kg";
  const pts = sessions.map(s => ({ date: s.date, v: metricOf[ui.metric](s.e) }));
  const bestE = sessions.reduce((b, s) => { const v = metricOf.e1rm(s.e); return v > b.v ? { v, date: s.date } : b; }, { v: 0, date: "" });
  const bestW = sessions.reduce((b, s) => { const v = metricOf.max(s.e); return v > b.v ? { v, date: s.date } : b; }, { v: 0, date: "" });
  const bodyweight = bestW.v === 0;
  const bestR = sessions.reduce((b, s) => Math.max(b, ...s.e.sets.map(x => x.r)), 0);

  body.innerHTML = `
    <div class="pbs">
      ${bodyweight
        ? `<div class="pb"><div class="k">最高回数</div><div class="v">${bestR}<small> 回</small></div></div>`
        : `<div class="pb"><div class="k">推定1RM ベスト</div><div class="v">${fmtW(bestE.v)}<small> kg</small></div><div class="d">${fmtDate(bestE.date)}</div></div>
           <div class="pb"><div class="k">最大重量</div><div class="v">${fmtW(bestW.v)}<small> kg</small></div><div class="d">${fmtDate(bestW.date)}</div></div>`}
      <div class="pb"><div class="k">記録した回数</div><div class="v">${sessions.length}<small> 回</small></div><div class="d">初回 ${fmtDate(sessions[0].date)}</div></div>
    </div>
    ${bodyweight && ui.metric !== "vol"
      ? `<p class="note">自重種目のため重量のグラフはありません。</p>`
      : `<div class="chart">${chartSvg(pts, unit)}</div>`}
    <p class="note">推定1RM はエプリー式（重量 ×（1 + 回数 ÷ 30））で、その日いちばん高いセットの値です。赤い点がベスト。</p>
    <h2>最近のセッション</h2>
    ${sessions.slice(-6).reverse().map(s => `<div class="day"><div class="day-head"><span class="day-date">${fmtDate(s.date)}</span><span class="day-meta"><span class="num">${fmtN(exVol(s.e))}</span> kg</span></div><span class="num">${esc(setsText(s.e.sets))}</span></div>`).join("")}`;
}

function ik(a, t, l1, l2, bend) {
  const dx = t[0] - a[0], dy = t[1] - a[1], d = Math.max(.01, Math.min(Math.hypot(dx, dy), l1 + l2 - .01));
  const ang = Math.atan2(dy, dx) + bend * Math.acos(Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d))));
  const m = [a[0] + l1 * Math.cos(ang), a[1] + l1 * Math.sin(ang)];
  const ea = Math.atan2(t[1] - m[1], t[0] - m[0]);
  return [m, [m[0] + l2 * Math.cos(ea), m[1] + l2 * Math.sin(ea)]];
}
const at = (o, len, deg) => [o[0] + len * Math.cos(deg * Math.PI / 180), o[1] + len * Math.sin(deg * Math.PI / 180)];
function joints(p, front) {
  if (!front) {
    const shoulder = at(p.hip, BONE.torso, p.t);
    const [elbow, hand] = ik(shoulder, p.hand, BONE.ua, BONE.fa, p.eb ?? 1);
    const [knee, foot] = ik(p.hip, p.foot, BONE.th, BONE.sh, p.kb ?? -1);
    return { hip: p.hip, shoulder, head: at(shoulder, BONE.neck, p.t), elbow, hand, knee, foot, toe: at(foot, BONE.ft, p.ft ?? 0) };
  }
  // 正面の図：左右の腕と脚を鏡写しに曲げる
  const [cx, cy] = p.sc, sh = [[cx - 13, cy], [cx + 13, cy]], j = { front: true, sc: p.sc, shoulder: sh, head: [cx + (p.head?.[0] ?? 0), cy + (p.head?.[1] ?? -15)] };
  const arms = sh.map((s, i) => ik(s, p.hands[i], BONE.ua, BONE.fa, (p.eb ?? 1) * (i ? -1 : 1)));
  j.elbow = arms.map(a => a[0]); j.hand = arms.map(a => a[1]);
  if (p.hip) {
    j.hipC = p.hip; j.hip = [[p.hip[0] - 7, p.hip[1]], [p.hip[0] + 7, p.hip[1]]];
    if (p.feet) { const legs = j.hip.map((h, i) => ik(h, p.feet[i], BONE.th, BONE.sh, (p.kb ?? 1) * (i ? -1 : 1))); j.knee = legs.map(l => l[0]); j.foot = legs.map(l => l[1]); }
  }
  return j;
}
const f1 = n => +n.toFixed(1);
const poly = (...pts) => `<polyline points="${pts.map(p => p.map(f1).join(",")).join(" ")}"/>`;
const many = v => Array.isArray(v[0]) ? v : [v];
function bodySvg(j, cls) {
  let s;
  if (j.front) {
    s = poly(j.sc, j.head) + poly(...j.shoulder) + j.shoulder.map((p, i) => poly(p, j.elbow[i], j.hand[i])).join("");
    if (j.hip) s += poly(j.sc, j.hipC) + poly(...j.hip);
    if (j.knee) s += j.hip.map((p, i) => poly(p, j.knee[i], j.foot[i])).join("");
  } else {
    s = poly(j.toe, j.foot, j.knee, j.hip, j.shoulder, j.head) + poly(j.shoulder, j.elbow, j.hand);
  }
  return `<g class="${cls}">${s}<circle cx="${f1(j.head[0])}" cy="${f1(j.head[1])}" r="8"/></g>`;
}
function gearSvg(items, j) {
  return items.map(g => {
    const pts = (typeof g.at === "string" ? many(j[g.at]) : [g.at || [0, 0]]).map(p => [p[0] + (g.dx || 0), p[1] + (g.dy || 0)]);
    return pts.map(([x, y]) => {
      if (g.k === "line") return `<line x1="${g.a[0]}" y1="${g.a[1]}" x2="${g.b[0]}" y2="${g.b[1]}" stroke-width="${g.w || 6}"/>`;
      if (g.k === "rect") return `<rect class="solid" x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="2"/>`;
      if (g.k === "plate") return `<circle cx="${f1(x)}" cy="${f1(y)}" r="13" stroke-width="4"/><circle class="solid" cx="${f1(x)}" cy="${f1(y)}" r="3"/>`;
      if (g.k === "db") return `<circle cx="${f1(x)}" cy="${f1(y)}" r="6.5" stroke-width="3.5"/>`;
      if (g.k === "dbf") return `<rect class="solid" x="${f1(x - 9)}" y="${f1(y - 2)}" width="18" height="4"/><rect class="solid" x="${f1(x - 11)}" y="${f1(y - 6)}" width="5" height="12" rx="1"/><rect class="solid" x="${f1(x + 6)}" y="${f1(y - 6)}" width="5" height="12" rx="1"/>`;
      if (g.k === "bar" || g.k === "pad") return `<circle class="solid" cx="${f1(x)}" cy="${f1(y)}" r="${g.k === "bar" ? 3.5 : 6}"/>`;
      if (g.k === "roller") return `<circle cx="${f1(x)}" cy="${f1(y + 3)}" r="8" stroke-width="4"/>`;
      if (g.k === "cable") return `<line x1="${g.from[0]}" y1="${g.from[1]}" x2="${f1(x)}" y2="${f1(y)}" stroke-width="1.5"/><circle class="solid" cx="${g.from[0]}" cy="${g.from[1]}" r="5"/>`;
      if (g.k === "sled") return `<line x1="${f1(x - 13)}" y1="${f1(y - 13)}" x2="${f1(x + 9)}" y2="${f1(y + 9)}" stroke-width="7"/>`;
      return "";
    }).join("");
  }).join("");
}
function arrowSvg(a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy);
  if (d < 12) return "";
  const ux = dx / d, uy = dy / d, s = [a[0] + ux * 5, a[1] + uy * 5], e = [b[0] - ux * 7, b[1] - uy * 7];
  const h = [[e[0] + ux * 6, e[1] + uy * 6], [e[0] - uy * 5, e[1] + ux * 5], [e[0] + uy * 5, e[1] - ux * 5]];
  return `<line x1="${f1(s[0])}" y1="${f1(s[1])}" x2="${f1(e[0])}" y2="${f1(e[1])}"/><polygon points="${h.map(p => p.map(f1).join(",")).join(" ")}"/>`;
}
// i=0 はスタート、i=1 はフィニッシュ（スタートの姿勢を薄く重ね、動く向きを矢印で示す）
function poseSvg(g, i) {
  const front = g.view === "front", pose = g.poses[i], j = joints(pose, front);
  let s = `<g class="fig-gear">${gearSvg([...(g.g || []), ...(pose.g || [])], j)}</g>`;
  if (i) {
    const j0 = joints(g.poses[0], front), key = g.track || "hand";
    s = bodySvg(j0, "fig-ghost") + s + bodySvg(j, "fig-body");
    s += `<g class="fig-arrow">${many(j0[key]).map((p, n) => arrowSvg(p, many(j[key])[n])).join("")}</g>`;
  } else s += bodySvg(j, "fig-body");
  const sc = g.scale || 1;
  return `<svg viewBox="0 0 160 150" role="img" aria-label="${i ? "フィニッシュ" : "スタート"}の姿勢"><line class="fig-floor" x1="0" y1="146" x2="160" y2="146"/><g transform="translate(80 146) scale(${sc}) translate(-80 -146)">${s}</g></svg>`;
}
// 人体図（左半身だけ描き、x=50 で鏡写しにする）。viewBox は 1 体あたり 100×210
const BODY_SIL = '<ellipse cx="50" cy="13" rx="8.5" ry="10.5"/>'
  + '<path d="M50 22 L44 23 L44 30 Q33 31 26 33 Q17 35 16 45 Q15 60 16 73 Q13 90 15 106 L13 114 Q14 122 19 123 Q23 121 23 113 L21 106 Q25 91 26 76 Q27 64 28 53 Q31 72 31 96 Q28 112 30 128 Q29 141 33 152 Q30 172 33 191 L31 200 Q30 204 34 204 L43 204 Q45 200 42 192 Q46 175 45 159 Q48 140 48 122 L50 118 Z"/>';

// level(m) は 0〜4。0 は鍛えていない部位
function bodyMap(level, cls = "") {
  const fig = (v, x, label) => {
    const b = BODY[v], mir = s => `${s}<g transform="translate(100 0) scale(-1 1)">${s}</g>`;
    const parts = Object.entries(b.parts).map(([m, ds]) => {
      const lv = level(m), d = ds.map(p => `<path d="${p}"/>`).join("");
      const mid = m === "traps" && b.mid ? b.mid.map(p => `<path d="${p}"/>`).join("") : "";
      return `<g class="m lv${lv}"><title>${MUSCLE[m]}</title>${mid}${d ? mir(d) : ""}</g>`;
    }).join("");
    return `<g transform="translate(${x} 0)"><g class="bm-sil">${mir(BODY_SIL)}</g>${parts}<text x="50" y="219">${label}</text></g>`;
  };
  return `<svg class="body-map ${cls}" viewBox="0 0 210 224" role="img" aria-label="鍛えた部位">${fig("front", 0, "前")}${fig("back", 110, "後")}</svg>`;
}
// 効く部位の図：主に効く部位は濃く、補助で使う部位は薄く塗る

function openGuide(name, fromLog) {

    <h2>効く部位</h2>

    <h2>やり方</h2>

  d.showModal(); d.scrollTop = 0;
}
