<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@500;800&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1860px;background:#d9dbe0;font-family:"M PLUS 1p",sans-serif;padding:48px 40px 56px;color:#16181d}
.g{display:grid;grid-template-columns:repeat(4,410px);gap:40px;justify-content:center}
.ph{width:410px;border-radius:44px;overflow:hidden;border:10px solid #16181d;box-shadow:0 20px 40px rgba(0,0,0,.18);height:864px}
.ph img{display:block;width:390px;height:844px}
h2{font-size:26px;font-weight:800;margin:20px 0 4px}
p{font-size:15px;color:#4a4f5a;line-height:1.55}
</style></head><body><div class="g">
<div><div class="ph"><img src="../a-iron.png"></div><h2>A. IRON</h2><p>黒い鉄×セーフティイエロー。床のハザードラインと極太の数字で、ハードなジムの空気。</p></div>
<div><div class="ph"><img src="../b-plate.png"></div><h2>B. PLATE</h2><p>白地にプレートの赤・青・黄・緑。斜体の太字で勢いを出すスポーツブランド調。</p></div>
<div><div class="ph"><img src="../c-chalk.png"></div><h2>C. CHALKBOARD</h2><p>ボックスジムの黒板。チョークの手書き数字で、記録を「書く」感覚。</p></div>
<div><div class="ph"><img src="../d-board.png"></div><h2>D. GYM CLOCK</h2><p>壁のインターバルタイマー風。赤いLED数字と休憩タイマーを主役にした実用型。</p></div>
</div></body></html>
