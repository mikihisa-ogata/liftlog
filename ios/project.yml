# xcodegen generate で LiftLog.xcodeproj を作り直す
name: LiftLog
options:
  bundleIdPrefix: io.github.mikihisa-ogata
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "6.0"
    # App Store に出すたびに MARKETING_VERSION（表示する版）か CURRENT_PROJECT_VERSION（ビルド番号）を上げる
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # 署名に使う Apple Developer Program のチーム ID（アプリとウィジェットで共通）
    DEVELOPMENT_TEAM: 2C4JPU3VG6
    CODE_SIGN_STYLE: Automatic
targets:
  LiftLog:
    type: application
    platform: iOS
    sources:
      - path: LiftLog
      - path: Shared
    dependencies:
      - target: LiftLogWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mikihisa-ogata.liftlog
        PRODUCT_NAME: LiftLog
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: リフトログ
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSCameraUsageDescription: 体の変化を見比べる写真を撮るために使います。写真はこの端末の中だけに保存されます。
        INFOPLIST_KEY_CFBundleDevelopmentRegion: ja
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        SWIFT_EMIT_LOC_STRINGS: NO
  # ロック画面・Dynamic Island のライブアクティビティ。ボタンの処理はアプリ側で動く（Shared/WorkoutActivity.swift）
  LiftLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LiftLogWidget
      - path: Shared
    info:
      path: LiftLogWidget/Info.plist
      properties:
        CFBundleDisplayName: リフトログ
        # アプリ本体と同じ版にしないと App Store に出せない
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mikihisa-ogata.liftlog.widget
        PRODUCT_NAME: LiftLogWidget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        SWIFT_EMIT_LOC_STRINGS: NO
        SKIP_INSTALL: YES
  LiftLogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LiftLogTests]
    dependencies:
      - target: LiftLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LiftLog:
    build:
      targets:
        LiftLog: all
        LiftLogTests: [test]
    test:
      targets: [LiftLogTests]
