# xcodegen generate で LiftLog.xcodeproj を作り直す
name: LiftLog
options:
  bundleIdPrefix: io.github.mikihisa-ogata
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LiftLog:
    type: application
    platform: iOS
    sources: [LiftLog]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mikihisa-ogata.liftlog
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: リフトログ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  LiftLogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LiftLogTests]
    dependencies:
      - target: LiftLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LiftLog:
    build:
      targets:
        LiftLog: all
        LiftLogTests: [test]
    test:
      targets: [LiftLogTests]
