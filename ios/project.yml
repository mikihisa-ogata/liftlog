# xcodegen generate で LiftLog.xcodeproj を作り直す
name: LiftLog
options:
  bundleIdPrefix: io.github.mikihisa-ogata
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "6.0"
    # App Store に出すたびに MARKETING_VERSION（表示する版）か CURRENT_PROJECT_VERSION（ビルド番号）を上げる
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # 署名は Apple Developer Program のチーム ID を入れる（Xcode の Signing & Capabilities で選んでもよい）
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  LiftLog:
    type: application
    platform: iOS
    sources:
      - path: LiftLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mikihisa-ogata.liftlog
        PRODUCT_NAME: LiftLog
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: リフトログ
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSCameraUsageDescription: 体の変化を見比べる写真を撮るために使います。写真はこの端末の中だけに保存されます。
        INFOPLIST_KEY_CFBundleDevelopmentRegion: ja
        SWIFT_EMIT_LOC_STRINGS: NO
  LiftLogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LiftLogTests]
    dependencies:
      - target: LiftLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LiftLog:
    build:
      targets:
        LiftLog: all
        LiftLogTests: [test]
    test:
      targets: [LiftLogTests]
